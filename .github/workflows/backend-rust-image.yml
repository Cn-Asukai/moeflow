name: build-backend-rust-image

on:
  push:
    tags:
      - "**"

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/cn-asukai/moeflow/backend-rust
  CNB_IMAGE: docker.cnb.cool/longlian.online/moeflow/backend-rust

jobs:
  build-push-backend-rust:
    name: Build & push backend-rust image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.CNB_IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push (single build, both registries)
        uses: docker/build-push-action@v6
        with:
          context: backend-rust
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
